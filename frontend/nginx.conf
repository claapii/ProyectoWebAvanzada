server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver de Docker: permite que el contenedor arranque aunque el backend tarde.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # /api/* llega al backend como /* (igual que hace Caddy en staging).
  location /api/ {
    set $backend http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de Angular: cualquier ruta desconocida devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}