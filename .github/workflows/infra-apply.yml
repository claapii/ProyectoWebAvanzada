name: Infra Apply Staging LISTOCO

# Crea o actualiza el servidor de staging en Azure. Es manual a proposito: crea recursos
# que consumen credito. Pasos previos de una sola vez: infra/README.md.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "apply" para crear o actualizar la infraestructura en Azure'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-staging
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform apply
    if: ${{ inputs.confirmar == 'apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_dns_label: ${{ vars.AZURE_DNS_LABEL }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Verificar configuracion
        run: |
          missing=""
          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID TF_VAR_location TF_VAR_dns_label TF_VAR_ssh_public_key TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos o variables de GitHub (ver infra/README.md):${missing}"
            exit 1
          fi

      # Version fija y hash SHA-256 verificado (SHA256SUMS oficial de HashiCorp).
      - name: Instalar Terraform
        env:
          TERRAFORM_VERSION: "1.16.6"
          TERRAFORM_SHA256: "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7"
        run: |
          curl -sSfL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  /tmp/terraform.zip" | sha256sum --check --strict
          sudo unzip -o /tmp/terraform.zip terraform -d /usr/local/bin
          terraform version

      - name: Inicializar con estado remoto
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=staging.tfstate"

      - name: Validar
        run: terraform validate

      - name: Aplicar
        run: terraform apply -auto-approve -input=false -lock-timeout=300s

      - name: Resumen
        run: |
          {
            echo "### Infraestructura de staging aplicada"
            echo ""
            echo "- Direccion: https://$(terraform output -raw fqdn)"
            echo "- IP publica: $(terraform output -raw public_ip_address)"
            echo "- SSH: \`$(terraform output -raw ssh_command)\`"
            echo ""
            echo "El servidor tarda unos minutos en terminar su primer arranque (instala Docker). El workflow CD Staging espera ese momento solo."
          } >> "$GITHUB_STEP_SUMMARY"