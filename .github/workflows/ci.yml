name: CI DevSecOps LISTOCO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint TypeScript
        run: npm run lint

      - name: Iniciar PostgreSQL efimero para pruebas de integracion
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::${PASSWORD}"
          docker run -d --name postgres-test \
            -e POSTGRES_USER=listoco_test \
            -e POSTGRES_PASSWORD="${PASSWORD}" \
            -e POSTGRES_DB=listoco_test \
            -p 5432:5432 \
            postgres:17-alpine
          echo "TEST_DATABASE_URL=postgresql://listoco_test:${PASSWORD}@localhost:5432/listoco_test?schema=public" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec postgres-test pg_isready -h 127.0.0.1 -U listoco_test -d listoco_test && exit 0
            sleep 1
          done
          echo "PostgreSQL no estuvo listo a tiempo"
          exit 1

      - name: Aplicar migraciones a la base de pruebas
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Ejecutar pruebas (unitarias e integracion con PostgreSQL)
        env:
          REQUIRE_DB_TESTS: "true"
        run: npm run test

      - name: Construir NestJS
        run: npm run build

      - name: Detener PostgreSQL de pruebas
        if: always()
        run: docker rm -f postgres-test


  frontend:
    name: Frontend Ionic Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm run test -- --watch=false

      - name: Construir Angular
        run: npm run build


  python:
    name: Servicio Python FastAPI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Validar sintaxis
        run: python -m compileall -q main.py app tests


  static-analysis:
    name: Analisis estatico CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python

      - name: Ejecutar CodeQL
        uses: github/codeql-action/analyze@v4


  dependency-analysis:
    name: Analisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Revisar dependencias backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Revisar dependencias frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1

      - name: Revisar dependencias Python
        run: python -m pip_audit -r python-service/requirements.txt


  secrets:
    name: Deteccion de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Obtener historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  quality-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - python
      - static-analysis
      - dependency-analysis
      - secrets

    steps:
      - name: Confirmar etapas criticas
        run: echo "Todas las etapas criticas del CI fueron aprobadas."