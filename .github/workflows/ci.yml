name: CI DevSecOps LISTOCO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint TypeScript
        run: npm run lint

      - name: Iniciar PostgreSQL efimero para pruebas de integracion
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::${PASSWORD}"
          docker run -d --name postgres-test \
            -e POSTGRES_USER=listoco_test \
            -e POSTGRES_PASSWORD="${PASSWORD}" \
            -e POSTGRES_DB=listoco_test \
            -p 5432:5432 \
            postgres:17-alpine
          echo "TEST_DATABASE_URL=postgresql://listoco_test:${PASSWORD}@localhost:5432/listoco_test?schema=public" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec postgres-test pg_isready -h 127.0.0.1 -U listoco_test -d listoco_test && exit 0
            sleep 1
          done
          echo "PostgreSQL no estuvo listo a tiempo"
          exit 1

      - name: Aplicar migraciones a la base de pruebas
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Ejecutar pruebas (unitarias e integracion con PostgreSQL)
        env:
          REQUIRE_DB_TESTS: "true"
        run: npm run test

      - name: Construir NestJS
        run: npm run build

      - name: Detener PostgreSQL de pruebas
        if: always()
        run: docker rm -f postgres-test


  frontend:
    name: Frontend Ionic Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm run test -- --watch=false

      - name: Construir Angular
        run: npm run build


  python:
    name: Servicio Python FastAPI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Validar sintaxis
        run: python -m compileall -q main.py app tests


  static-analysis:
    name: Analisis estatico CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python

      - name: Ejecutar CodeQL
        uses: github/codeql-action/analyze@v4


  dependency-analysis:
    name: Analisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Revisar dependencias backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Revisar dependencias frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1

      - name: Revisar dependencias Python
        run: python -m pip_audit -r python-service/requirements.txt


  secrets:
    name: Deteccion de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Obtener historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    terraform:
    name: Terraform (fmt, validate y plan)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_dns_label: ${{ vars.AZURE_DNS_LABEL }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      # Version fija y hash SHA-256 verificado (SHA256SUMS oficial de HashiCorp).
      - name: Instalar Terraform
        env:
          TERRAFORM_VERSION: "1.16.6"
          TERRAFORM_SHA256: "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7"
        run: |
          curl -sSfL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  /tmp/terraform.zip" | sha256sum --check --strict
          sudo unzip -o /tmp/terraform.zip terraform -d /usr/local/bin
          terraform version

      - name: Formato (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Inicializar sin estado remoto
        run: terraform init -backend=false -input=false

      - name: Validar (terraform validate)
        run: terraform validate

      - name: Plan contra Azure
        if: ${{ env.ARM_CLIENT_ID != '' && env.TFSTATE_STORAGE_ACCOUNT != '' }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=staging.tfstate"
          terraform plan -input=false -lock-timeout=60s

      - name: Aviso si no se ejecuto el plan
        if: ${{ env.ARM_CLIENT_ID == '' || env.TFSTATE_STORAGE_ACCOUNT == '' }}
        run: |
          echo "::warning::Plan omitido, faltan las credenciales de Azure o los datos del estado remoto (ver infra/README.md)."
  
  quality-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - python
      - static-analysis
      - dependency-analysis
      - secrets
      - terraform

    steps:
      - name: Confirmar etapas criticas
        run: echo "Todas las etapas criticas del CI fueron aprobadas."