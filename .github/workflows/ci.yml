name: CI DevSecOps LISTOCO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint TypeScript
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm run test

      - name: Construir NestJS
        run: npm run build


  frontend:
    name: Frontend Ionic Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm run test -- --watch=false

      - name: Construir Angular
        run: npm run build


  python:
    name: Servicio Python FastAPI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            python-service/requirements.txt
            python-service/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check .

      - name: Ejecutar pruebas
        run: python -m pytest test_main.py -q

      - name: Validar sintaxis
        run: python -m compileall -q main.py test_main.py


  static-analysis:
    name: Analisis estatico CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python

      - name: Ejecutar CodeQL
        uses: github/codeql-action/analyze@v4


  dependency-analysis:
    name: Analisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Revisar dependencias backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Revisar dependencias frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1

      - name: Revisar dependencias Python
        run: python -m pip_audit -r python-service/requirements.txt


  secrets:
    name: Deteccion de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Obtener historial completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  quality-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - python
      - static-analysis
      - dependency-analysis
      - secrets

    steps:
      - name: Confirmar etapas criticas
        run: echo "Todas las etapas criticas del CI fueron aprobadas."