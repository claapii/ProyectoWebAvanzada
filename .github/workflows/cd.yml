name: CD Staging LISTOCO

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Construir, escanear, publicar y desplegar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      APP_ENV: ${{ vars.APP_ENV }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Verificar variables configuradas
        run: |
          test -n "$APP_ENV"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_PORT"

      - name: Verificar secretos configurados
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$JWT_SECRET"

      - name: Definir nombres de las imagenes
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}/listoco" >> "$GITHUB_ENV"

      - name: Construir imagen frontend
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_PREFIX}-frontend:${GITHUB_SHA}" ./frontend

      - name: Construir imagen backend
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_PREFIX}-backend:${GITHUB_SHA}" ./backend

      - name: Construir imagen Python
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_PREFIX}-python:${GITHUB_SHA}" ./python-service

# Trivy se descarga de una version fija y se comprueba su hash SHA-256: en      # marzo de 2026 una version y las etiquetas de sus acciones oficiales fueron      # comprometidas, asi que no se usa n      - name: Instalar Trivy (version fija verificada por hash)
        env:
          TRIVY_VERSION: "0.76.0"
          TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Analizar vulnerabilidades de las imagenes
        run: |
          # Se analizan las tres imagenes antes de decidir, para ver todos los problemas en una sola ejecucion.
          failed=0
          for service in frontend backend python; do
            image="${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
            echo "::group::${service}: informe de vulnerabilidades ALTAS y CRITICAS"
            trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL "${image}"
            echo "::endgroup::"
            trivy image --no-progress --ignore-unfixed --severity CRITICAL --exit-code 1 "${image}"
          done

      - name: Iniciar sesion en GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagenes
        run: |
          for service in frontend backend python; do
            docker push "${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
          done

      - name: Copiar manifestos de despliegue a la VM
        if: ${{ secrets.AZURE_VM_IP != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.staging.yml,Caddyfile"
          target: "~/app"

      - name: Desplegar por SSH y verificar salud (con Rollback)
        if: ${{ secrets.AZURE_VM_IP != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/app && cd ~/app
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export IMAGE_TAG="${{ github.sha }}"
            export APP_ENV="${{ vars.APP_ENV }}"
            export POSTGRES_USER="${{ vars.POSTGRES_USER }}"
            export POSTGRES_DB="${{ vars.POSTGRES_DB }}"
            export POSTGRES_PORT="${{ vars.POSTGRES_PORT }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"

            # Capturar tag de la versión previa antes de desplegar
            PREV_TAG=$(docker inspect --format='{{.Config.Image}}' app-backend-1 2>/dev/null | cut -d':' -f2 || echo "")

            echo "Autenticando en GHCR y descargando imágenes de commit ${IMAGE_TAG}..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.staging.yml pull
            
            echo "Levantando contenedores..."
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            echo "Ejecutando Health Check en http://localhost/api/health..."
            HEALTH_OK=false
            for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health Check Exitoso (HTTP 200)!"
                HEALTH_OK=true
                break
              fi
              echo "Esperando respuesta de servicios... intento $i/10 (HTTP $STATUS)"
              sleep 5
            done

            if [ "$HEALTH_OK" = false ]; then
              echo "Health Check fallido. Ejecutando rollback automatico..."
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
                echo "Restaurando servicios a versión previa: $PREV_TAG"
                IMAGE_TAG="$PREV_TAG" docker compose -f docker-compose.staging.yml up -d
              else
                echo "No existe versión previa válida para restaurar."
              fi
              exit 1
            fi

      - name: Resumen de la version publicada
        run: |
          {
            echo "### Despliegue en Staging finalizado"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "- \`${IMAGE_PREFIX}-frontend:${GITHUB_SHA}\`"
            echo "- \`${IMAGE_PREFIX}-backend:${GITHUB_SHA}\`"
            echo "- \`${IMAGE_PREFIX}-python:${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"