services:
  postgres:
    image: postgres:17-alpine
    container_name: listoco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listoco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listoco_dev}
      POSTGRES_DB: ${POSTGRES_DB:-listoco}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-listoco} -d ${POSTGRES_DB:-listoco}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  python:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: listoco-python
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-listoco_dev_internal_key}
      SCRAPER_CONTACT: ${SCRAPER_CONTACT:-contacto-no-configurado}
      CACHE_DIR: /app/cache
    ports:
      - "8000:8000"
    volumes:
      - python_cache:/app/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: listoco-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-listoco}:${POSTGRES_PASSWORD:-listoco_dev}@postgres:5432/${POSTGRES_DB:-listoco}?schema=public
      JWT_SECRET: ${JWT_SECRET:-listoco_dev_jwt_secret}
      PYTHON_SERVICE_URL: http://python:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-listoco_dev_internal_key}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      python:
        condition: service_started
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: listoco-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  python_cache: